        if(r0.ok){ var j0 = await r0.json();
          try{ localStorage.setItem('wq.fbrt', j0.refresh_token||rt); }catch(e){}
          雲鍵 = { token:j0.id_token, exp:Date.now()+(Number(j0.expires_in||3600)-120)*1000 };
          return 雲鍵.token; }
        try{ localStorage.removeItem('wq.fbrt'); }catch(e){}
      }catch(e){}
    }
    var r = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+CLOUD.apiKey,
      { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({returnSecureToken:true}) });
    if(!r.ok) throw new Error('signin');
    var j = await r.json();
    try{ localStorage.setItem('wq.fbrt', j.refreshToken||''); }catch(e){}
    雲鍵 = { token:j.idToken, exp:Date.now()+(Number(j.expiresIn||3600)-120)*1000 };
    return 雲鍵.token;
  }
  var 雲URL = function(p){ return 'https://firestore.googleapis.com/v1/projects/'+CLOUD.projectId+
                                  '/databases/(default)/documents/'+p; };
  function ほどく(d){
    var o = {}, f = (d && d.fields) || {};
    Object.keys(f).forEach(function(k){ var v=f[k];
      if('booleanValue' in v) o[k]=v.booleanValue;
      else if('integerValue' in v) o[k]=Number(v.integerValue);
      else if('nullValue' in v) o[k]=null;
      else o[k]=v.stringValue; });
    return o;
  }
  function つつむ(o){
    var f = {};
    Object.keys(o).forEach(function(k){ var v=o[k];
      if(typeof v==='boolean') f[k]={booleanValue:v};
      else if(typeof v==='number') f[k]={integerValue:String(v)};
      else f[k]={stringValue:String(v)}; });
    return { fields:f };
  }
  async function 人を読む(name){
    var t = await 雲トークン(); if(!t) return null;
    var r = await fetch(雲URL(CLOUD.col+'_users/'+encodeURIComponent(name)), { headers:{ Authorization:'Bearer '+t } });
    if(r.status===404) return null;
    if(!r.ok) throw new Error('get '+r.status);
    return ほどく(await r.json());
  }
  async function 人を書く(name, rec){
    var t = await 雲トークン(); if(!t) return false;
    var r = await fetch(雲URL(CLOUD.col+'_users/'+encodeURIComponent(name)),
      { method:'PATCH', headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+t },
        body: JSON.stringify(つつむ(rec)) });
    if(!r.ok) throw new Error('put '+r.status);
    return true;
  }

  /* 縮めた中身をほどく（2026-11-08）。DecompressionStream がない古い端末は、同梱の fflate で */
  async function ほどく(buf){
    if(typeof DecompressionStream === 'function'){
      try{ return await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer(); }catch(e){}
    }
    if(!window.fflate){ (new Function(document.getElementById('zfb').textContent)).call(window); }
    return window.fflate.gunzipSync(new Uint8Array(buf));
  }
  /* ---- 中身をひらく ---- */
  async function ひらく(fileRaw, me, pw, name){
    try{ window.__lxShellBusy && window.__lxShellBusy(); }catch(e){} var buf = (window.__wqBuf && window.__wqBufR === fileRaw) ? window.__wqBuf : null; window.__wqBuf = null; window.__wqBufR = null;   /* 合言葉の確かめでほどいた中身をそのまま使う（2回ほどかない） */
    if(!buf){ var c0 = b2a(document.getElementById('payload').textContent.trim()); var k = await kagi(fileRaw, ['decrypt']); buf = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b2a(IV) }, k, c0); }
    if(typeof ZIP !== 'undefined' && ZIP) buf = await ほどく(buf);
    var html = new TextDecoder('utf-8').decode(buf);
    try{
      if(document.getElementById('keep').checked){
        localStorage.setItem('wq.pw', pw); localStorage.setItem('wq.uid', name);
      }else{
        localStorage.removeItem('wq.pw'); localStorage.removeItem('wq.uid');
      }
    }catch(e){}
    try{
      sessionStorage.setItem('wq.me', JSON.stringify(me));
      sessionStorage.setItem('wq.fk', a2b(fileRaw));
    }catch(e){}
    document.open('text/html','replace');
    document.write(html);
    document.close();
  }
  function ぜんぶの権限(){ var p={}; HAKEN.forEach(function(k){ p[k]=true; }); return p; }
  function 人から権限(d){ var p={}; HAKEN.forEach(function(k){ p[k] = !!d['p_'+k]; }); return p; }

  async function 入る(name, pw, quiet){
    var btn = document.getElementById('go');
    btn.disabled = true; err.style.color=''; err.textContent = quiet ? '' : 'ひらいています…';
    var nm = seiri(name) || ADMIN0;
    try{
      /* ① 元のパスワード（ファイルの鍵そのもの）。管理者の非常口 */
      var fileRaw = null;
      try{
        var raw = await tane(pw, b2a(SALT));
        var k = await kagi(raw, ['decrypt']);
        window.__wqBuf = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b2a(IV) },
          k, b2a(document.getElementById('payload').textContent.trim()));
        fileRaw = raw; window.__wqBufR = raw;
      }catch(e){}

      if(fileRaw){
        var me = { name: nm, admin:true, perms: ぜんぶの権限() };
        if(雲あり()){
          try{
            var d0 = await 人を読む(nm);
            if(!d0){                                    // はじめての管理者をつくっておく
              var s2 = crypto.getRandomValues(new Uint8Array(16));
              var v2 = crypto.getRandomValues(new Uint8Array(12));
              var uk = await kagi(await tane(pw, s2), ['encrypt']);
              var wr = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv:v2}, uk, fileRaw));
              var rec = { name:nm, salt:a2b(s2), iv:a2b(v2), wrap:a2b(wr), admin:true, savedAt:new Date().toISOString() };
              HAKEN.forEach(function(x){ rec['p_'+x] = true; });
              await 人を書く(nm, rec);
            }else{
              me.admin = !!d0.admin;
              me.perms = d0.admin ? ぜんぶの権限() : 人から権限(d0);
            }
          }catch(e){}
        }
        return await ひらく(fileRaw, me, pw, nm);
      }

      /* ② 登録した人のパスワード（クラウドに置いた鍵の包みをほどく） */
      if(!雲あり()) throw new Error('だめ');
      var d = await 人を読む(nm);
      if(!d || !d.wrap) throw new Error('だめ');
      var uk2 = await kagi(await tane(pw, b2a(d.salt)), ['decrypt']);
      var fr = new Uint8Array(await crypto.subtle.decrypt({ name:'AES-GCM', iv:b2a(d.iv) }, uk2, b2a(d.wrap)));
      var me2 = { name: nm, admin: !!d.admin, perms: d.admin ? ぜんぶの権限() : 人から権限(d) };
      return await ひらく(fr, me2, pw, nm);

    }catch(e){
      btn.disabled = false;
      err.textContent = 'なまえかパスワードが違います';
      try{ localStorage.removeItem('wq.pw'); localStorage.removeItem('wq.uid'); }catch(e2){}
      var pe = document.getElementById('pw'); pe.value=''; pe.focus();
    }
  }

  document.getElementById('f').addEventListener('submit', function(e){
    e.preventDefault();
    var v = document.getElementById('pw').value;
    if(v) 入る(document.getElementById('uid').value, v, false);
  });

  try{ document.getElementById('bld').textContent = '版 ' + BUILD; }catch(e){}

  /* 新しい版が上がっていたら、キャッシュを飛ばして入れかえる */
  function 新しい版をみる(){
    return new Promise(function(done){
      var t = setTimeout(function(){ done(false); }, 6000);
      try{
        if(sessionStorage.getItem('wq.ck')){ clearTimeout(t); done(false); return; }
        sessionStorage.setItem('wq.ck','1');
      }catch(e){ clearTimeout(t); done(false); return; }
      fetch(location.pathname + '?v=' + Date.now(), { cache:'no-store', headers:{ 'Range':'bytes=0-399' } })
        .then(function(r){ return r.text(); })
        .then(function(txt){
          clearTimeout(t);
          var m = txt.match(/<!--BUILD:([^>]*?)-->/);
          if(!m || m[1] === BUILD){ done(false); return; }
          location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]));
          done(true);
        })
        .catch(function(){ clearTimeout(t); done(false); });
    });
  }

  新しい版をみる().then(function(かわる){
    if(かわる) return;
    var saved = null, uid = null;
    try{ saved = localStorage.getItem('wq.pw'); uid = localStorage.getItem('wq.uid'); }catch(e){}
    var stay = null;
    try{ stay = sessionStorage.getItem('wq.stay'); if(stay) sessionStorage.removeItem('wq.stay'); }catch(e){}
    if(uid){ try{ document.getElementById('uid').value = uid; }catch(e){} }
    if(saved && !stay){ 入る(uid||'', saved, true); return; }
    if(saved){ try{ document.getElementById('pw').value = saved; }catch(e){} }
    setTimeout(function(){ try{ document.getElementById('pw').focus(); }catch(e){} }, 200);
  });
})();
