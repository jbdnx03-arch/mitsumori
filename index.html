<title>ワークス見積メーカー</title>
<style>
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html,body{margin:0;height:100%}
  body{
    font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    background:#14646E; color:#fff; display:grid; place-items:center; padding:24px;
  }
  .card{
    background:#fff; color:#16272B; border-radius:16px; padding:22px 20px 18px;
    width:100%; max-width:330px; box-shadow:0 14px 40px rgba(0,0,0,.28);
  }
  .card img{width:64px;height:64px;display:block;margin:0 auto 12px;border-radius:14px}
  h1{font-size:16px; margin:0 0 4px; text-align:center; letter-spacing:.04em}
  p.s{font-size:12px; color:#6B8288; margin:0 0 16px; text-align:center}
  label{display:block; font-size:11.5px; font-weight:700; color:#4A6065; margin-bottom:4px}
  input[type=text], input[type=password]{
    width:100%; box-sizing:border-box; font-size:16px; padding:11px 12px;
    border:1px solid #D2DEDF; border-radius:9px; background:#F6F9F9; color:#16272B;
  }
  .row{display:flex; align-items:center; gap:7px; margin:12px 0 14px; font-size:12.5px; color:#4A6065}
  .row input{accent-color:#14646E; width:auto}
  button{
    width:100%; appearance:none; border:0; border-radius:10px; cursor:pointer;
    background:#14646E; color:#fff; font-size:15px; font-weight:700; padding:12px;
    font-family:inherit;
  }
  button:disabled{opacity:.55}
  .err{color:#A8451B; font-size:12.5px; font-weight:700; margin-top:10px; text-align:center; min-height:1.2em}
</style>

<script>
(function(){
  "use strict";
  var SALT = "7GQPidf/4u9oWXoZz6mNjQ==", IV = "UmeyiVLhPyZDkitR";
  function b2a(b64){ var s=atob(b64), a=new Uint8Array(s.length); for(var i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; }
  var err = document.getElementById('err');

  async function open_(pw, quiet){
    var btn = document.getElementById('go');
    btn.disabled = true; err.textContent = quiet ? '' : 'ひらいています…';
    try{
      var enc = new TextEncoder();
      var base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey(
        { name:'PBKDF2', salt:b2a(SALT), iterations:250000, hash:'SHA-256' },
        base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
      var ct = b2a(document.getElementById('payload').textContent.trim());
      var buf = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b2a(IV) }, key, ct);
      var html = new TextDecoder('utf-8').decode(buf);
      if(document.getElementById('keep').checked){
        try{ localStorage.setItem('wq.pw', pw); }catch(e){}
      }else{
        try{ localStorage.removeItem('wq.pw'); }catch(e){}
      }
      document.open('text/html','replace');
      document.write(html);
      document.close();
    }catch(e){
      btn.disabled = false;
      err.textContent = 'あいことばが違います';
      try{ localStorage.removeItem('wq.pw'); }catch(e2){}
      document.getElementById('pw').value = '';
      document.getElementById('pw').focus();
    }
  }

  document.getElementById('f').addEventListener('submit', function(e){
    e.preventDefault();
    var v = document.getElementById('pw').value;
    if(v) open_(v, false);
  });

  var saved = null;
  try{ saved = localStorage.getItem('wq.pw'); }catch(e){}
  if(saved){ open_(saved, true); }
  else{ setTimeout(function(){ try{ document.getElementById('pw').focus(); }catch(e){} }, 200); }
})();
</script>
