<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>請求ナビ Web（試作）</title></head><body>

<style>
:root{--bg:#F4F6F6;--surface:#fff;--ink:#16272B;--ink2:#4A5D60;--ink3:#7A8B8E;--line:#DCE4E5;--brand:#14646E;--brand2:#0E4C54;--soft:#E9F2F3;--warn:#B7791F;--warnbg:#FFF6E5;--ng:#B3412E;--ngbg:#FBEDEA;--ok:#2F7D4F;--okbg:#E8F4EC;--hand:#7A3FB0;--handbg:#F3ECFA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1719;--surface:#162226;--ink:#E3ECEE;--ink2:#B4C3C6;--ink3:#839598;--line:#2A3A3E;--brand:#4FA3AC;--brand2:#7CC0C8;--soft:#1C2E32;--warn:#E0A955;--warnbg:#2E2617;--ng:#E58A78;--ngbg:#33201C;--ok:#7FC79B;--okbg:#18291F;--hand:#C49BEA;--handbg:#291E33}}
:root[data-theme="dark"]{--bg:#0F1719;--surface:#162226;--ink:#E3ECEE;--ink2:#B4C3C6;--ink3:#839598;--line:#2A3A3E;--brand:#4FA3AC;--brand2:#7CC0C8;--soft:#1C2E32;--warn:#E0A955;--warnbg:#2E2617;--ng:#E58A78;--ngbg:#33201C;--ok:#7FC79B;--okbg:#18291F;--hand:#C49BEA;--handbg:#291E33}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;font-size:14px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--brand2);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.top h1{margin:0;font-size:16px;letter-spacing:.06em}
.top h1 small{font-size:11px;opacity:.75;margin-left:6px;font-weight:400}
.top .who{font-size:12px;opacity:.9}
.top .sp{flex:1}
.tabs{display:flex;gap:4px}
.tabs button{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;min-height:36px}
.tabs button.on{background:#fff;color:var(--brand2);font-weight:700}
kbd{display:inline-block;min-width:16px;padding:0 4px;border-radius:4px;border:1px solid currentColor;font-size:10px;line-height:15px;text-align:center;opacity:.75;margin-left:5px;font-family:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.card h2 .n{font-size:11px;color:var(--ink3);font-weight:400}
.muted{color:var(--ink3);font-size:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:36px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.btn.ghost{background:transparent}
.btn.sm{padding:3px 8px;min-height:28px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;background:var(--surface);cursor:pointer}
.drop.on{border-color:var(--brand);background:var(--soft)}
.drop b{display:block;font-size:15px;margin-bottom:4px}
.drop .st{margin-top:6px;font-size:12px;color:var(--ok);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi .k{font-size:11px;color:var(--ink3)}
.kpi .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:11px;color:var(--ink2);margin-top:2px}
.kpi.ok{border-color:var(--ok);background:var(--okbg)} .kpi.ng{border-color:var(--ng);background:var(--ngbg)}
.main{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:1fr}}
.sites{position:sticky;top:68px;max-height:calc(100vh - 84px);overflow:auto;padding:6px}
.site{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:9px;padding:8px 10px;cursor:pointer;margin-bottom:2px}
.site:hover{background:var(--soft)}
.site.on{border-color:var(--brand);background:var(--soft)}
.site .t{display:flex;justify-content:space-between;gap:6px;font-weight:700}
.site .t span:last-child{font-variant-numeric:tabular-nums}
.site .b{font-size:11px;color:var(--ink3);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:999px;background:var(--soft);color:var(--brand2);font-weight:700}
.tag.hand{background:var(--handbg);color:var(--hand)} .tag.new{background:var(--warnbg);color:var(--warn)} .tag.ng{background:var(--ngbg);color:var(--ng)} .tag.ok{background:var(--okbg);color:var(--ok)}
.sh{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.sh .nm{flex:1;min-width:0;flex-basis:240px}
.sh .nm input{font-size:17px;font-weight:800;border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 4px;width:100%}
.sh .nm input:focus{border-color:var(--line);background:var(--surface)}
.sh .nm .full{font-size:12px;color:var(--ink2);padding:0 4px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--ink3)}
.fld input{font-size:14px;color:var(--ink);padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);width:130px}
.tot{display:grid;grid-template-columns:repeat(4,auto);gap:4px 16px;font-variant-numeric:tabular-nums;margin-top:10px;font-size:13px;align-items:baseline}
.tot b{font-size:16px}
table.ln{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
table.ln th{font-size:11px;color:var(--ink3);font-weight:600;text-align:left;padding:5px 4px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:60px;background:var(--surface)}
table.ln td{padding:4px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.ln td.n,table.ln th.n{text-align:right;font-variant-numeric:tabular-nums}
table.ln tr.hand td{background:var(--handbg)}
table.ln tr.man td{background:var(--warnbg)}
table.ln input.e{width:100%;border:1px solid transparent;background:transparent;border-radius:5px;padding:2px 4px;text-align:inherit;font-variant-numeric:tabular-nums}
table.ln input.e:hover{border-color:var(--line)}
table.ln input.e:focus{border-color:var(--brand);background:var(--surface);outline:none}
table.ln td.n input.e{text-align:right}
table.ln .sub{font-size:10.5px;color:var(--ink3)}
table.ln .why{font-size:10.5px;color:var(--hand);margin-top:2px}
table.ln select{font-size:12px;border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:1px 2px}
.lnbtn{display:flex;gap:2px}
.lnbtn button{border:0;background:transparent;cursor:pointer;color:var(--ink3);font-size:14px;padding:2px 4px;border-radius:4px;min-width:24px}
.lnbtn button:hover{background:var(--soft);color:var(--ink)}
.chk{list-style:none;margin:0;padding:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.chk li .lv{flex:0 0 auto}
.chk li .tx{flex:1}
.chk li .tx small{display:block;color:var(--ink3);font-size:11.5px;margin-top:2px}
.prev{font-size:12px;border:1px dashed var(--line);border-radius:9px;padding:8px 10px;margin-top:10px;background:var(--bg)}
.prev b{font-size:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#16272B;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw}
.empty{padding:40px 20px;text-align:center;color:var(--ink3)}
details.help{font-size:12px;color:var(--ink2);margin-top:8px}
.pv{background:#cfd6d7;padding:16px;border-radius:12px;overflow:auto}
.pv .pp{margin:0 auto 16px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.pvopts{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:13px}
.pvopts label{display:flex;gap:5px;align-items:center;cursor:pointer}

/* ===== 紙（印刷）。色は付けない ===== */
.pp{width:210mm;min-height:297mm;background:#fff;color:#000;padding:12mm 12mm 10mm;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","MS PMincho",serif;font-size:9pt;position:relative;overflow:hidden}
.pp *{color:#000}
.pp .ttl{text-align:center;font-size:18pt;letter-spacing:.6em;margin:2mm 0 4mm;border-bottom:1.2pt double #000;padding-bottom:1.5mm;width:90mm;margin-left:auto;margin-right:auto}
.pp .hd{display:flex;justify-content:space-between;gap:8mm}
.pp .to{font-size:9pt;line-height:1.6}
.pp .to .nm{font-size:13pt;margin-top:2mm;border-bottom:.6pt solid #000;display:inline-block;padding-right:10mm}
.pp .to .nm small{font-size:10pt;margin-left:5mm}
.pp .me{font-size:8.5pt;line-height:1.55;text-align:left;min-width:62mm}
.pp .me b{font-size:11pt;display:block}
.pp .meta{display:grid;grid-template-columns:auto auto;gap:.6mm 3mm;font-size:9pt;margin-top:2mm}
.pp table{border-collapse:collapse;width:100%}
.pp table.sum{margin-top:4mm}
.pp table.sum th,.pp table.sum td{border:.6pt solid #000;padding:1.2mm 1.5mm;font-size:8.5pt;text-align:center}
.pp table.sum td{text-align:right;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:9.5pt;height:8mm}
.pp table.dt{margin-top:4mm}
.pp table.dt th{border:.6pt solid #000;border-width:.6pt .3pt;font-weight:normal;font-size:7.5pt;padding:.8mm 1mm;background:#fff}
.pp table.dt td{border-left:.3pt solid #000;border-right:.3pt solid #000;padding:.5mm 1mm;font-size:7.6pt;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;vertical-align:top;line-height:1.35}
.pp table.dt tr.b td{border-bottom:.3pt solid #999}
.pp table.dt tr.last td{border-bottom:.6pt solid #000}
.pp table.dt td.r{text-align:right;white-space:nowrap}
.pp table.dt td.c{text-align:center;white-space:nowrap}
.pp table.dt{table-layout:fixed}
.pp table.dt td.nm{width:46mm;word-break:break-all}
.pp table.dt th:first-child{width:46mm}
.pp .note{margin-top:4mm;border:.6pt solid #000;padding:1.5mm 2mm;font-size:8pt;min-height:12mm}
.pp .bank{margin-top:3mm;font-size:7.5pt;line-height:1.5}
.pp .pgno{position:absolute;right:12mm;bottom:6mm;font-size:7pt;font-family:sans-serif}
.pp .kg td.nm{text-align:left}
/* 三貴 指定 */
.pp.sk{font-family:"Hiragino Sans","Noto Sans JP","Meiryo",sans-serif;font-size:8.5pt}
.pp.sk .sttl{text-align:center;font-size:17pt;letter-spacing:.5em;margin:4mm 0}
.pp.sk table.g td,.pp.sk table.g th{border:.6pt solid #000;padding:1.3mm 1.6mm;font-size:8.5pt}
.pp.sk table.g th{font-weight:normal;background:#fff}
.pp.sk .thick{border:1.6pt solid #000}
.pp.sk .r{text-align:right;font-variant-numeric:tabular-nums}
.pp.sk .c{text-align:center}
.pp.sk .small{font-size:7.5pt;line-height:1.5}
@page{size:A4 landscape;margin:0}
@page land{size:A4 landscape;margin:0}
@page port{size:A4 portrait;margin:0}
.pv .xp{margin:0 auto 16px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
@media print{
  .xp.land{page:land}
  .xp.port{page:port}
  #print .xp{margin:0;box-shadow:none;zoom:1}
  #print .xp:last-child{page-break-after:auto;break-after:auto}
  body{background:#fff}
  body > *:not(#print){display:none !important}
  #print{display:block !important}
  #print .pp{box-shadow:none;margin:0;page-break-after:always;break-after:page}
  #print .pp:last-child{page-break-after:auto;break-after:auto}
}
#print{display:none}
</style>

<div class="top">
  <h1>請求ナビ <small>Web 試作　版 <span id="verTxt">10/23 13:58</span></small></h1>
  <span class="who" id="who"></span>
  <span class="sp"></span>
  <div class="tabs" role="tablist">
    <button data-tab="load" class="on">読み込み<kbd>1</kbd></button>
    <button data-tab="sites">現場<kbd>2</kbd></button>
    <button data-tab="check">チェック<kbd>3</kbd></button>
    <button data-tab="paper">印刷・PDF<kbd>4</kbd></button>
  </div>
</div>

<div class="wrap">
  <section id="tab-load">
    <div class="card">
      <h2>① 今月のデータを入れる</h2>
      <div class="grid2">
        <label class="drop" id="dropCsv"><b>今月のCSV（システムの請求明細）</b><span class="muted">ここに置くか、押して選ぶ。Shift-JIS のままでOK</span><input type="file" id="fCsv" accept=".csv,text/csv" hidden><div class="st" id="stCsv"></div></label>
        <label class="drop" id="dropPrev"><b>前月の請求ナビ（.xlsm）か、引き継ぎファイル（.json）</b><span class="muted">現場の分け方・呼び名・工事番号・手直しを引き継ぐ</span><input type="file" id="fPrev" accept=".xlsm,.xlsx,.json" hidden><div class="st" id="stPrev"></div></label>
      </div>
      <div class="row" style="margin-top:12px;font-size:13px" id="carryOpt">
        <b style="font-size:12px;color:var(--ink2)">前月の手直し：</b>
        <label><input type="radio" name="carry" value="simple" checked> 単価・数量・品名の書きかえは自動（1行を分けた・別の品にした行は、確かめてから）</label>
        <label><input type="radio" name="carry" value="all"> 全部自動</label>
        <label><input type="radio" name="carry" value="none"> 引き継がない</label>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn primary" id="btnBuild" disabled>現場ごとに分けて、前月を引き継ぐ<kbd>Enter</kbd></button>
        <span class="muted" id="buildMsg">CSVを入れると押せます。前月は無くても作れます。</span>
      </div>
      <details class="help"><summary>このページについて</summary>
        読み込んだファイルは、このブラウザの中だけで計算します（どこにも送りません）。作業の途中はこの端末に自動で残ります。<br>
        前月の手直し（品名・数量・単価の書きかえ、1行を何行かに分けたもの）は、同じ伝票・同じ品が今月も続いていれば、そのまま今月にも入ります。金額は今月の日数で計算し直します。
      </details>
    </div>
    <div class="card" id="resumeCard" hidden>
      <h2>途中の作業があります</h2>
      <div class="row"><span id="resumeTxt"></span><button class="btn" id="btnResume">続きから開く</button><button class="btn ghost" id="btnDrop">消す</button></div>
    </div>
  </section>

  <section id="tab-sites" hidden>
    <div class="kpis" id="kpis"></div>
    <div class="main" style="margin-top:14px">
      <div class="card sites" id="siteList"></div>
      <div id="siteBody"></div>
    </div>
  </section>

  <section id="tab-check" hidden>
    <div class="card"><h2>チェック <span class="n">直したら自動で消えます。押すとその現場・行へ</span></h2><ul class="chk" id="chkList"></ul></div>
  </section>

  <section id="tab-paper" hidden>
    <div class="card">
      <div class="pvopts" id="pvOpts"></div>
      <div class="row"><button class="btn primary" id="btnPrint">印刷する／PDFに保存<kbd>P</kbd></button><button class="btn" id="btnExport">引き継ぎファイルを保存（来月用）</button><span class="muted">PDFは印刷の画面で「PDFに保存」</span></div>
    </div>
    <div class="pv" id="pv"></div>
  </section>
</div>
<div id="print"></div>
<div class="toast" id="toast" hidden></div>

.xin{position:relative}
.xf,.xl{position:absolute;display:block}

.xt{position:absolute;display:flex;box-sizing:border-box;white-space:nowrap;line-height:1.1;padding:0 2px}
.xt>b{font-weight:inherit;display:block;flex:1 1 auto;min-width:0;text-align:left;white-space:pre;overflow:visible}
.xt.hc>b{text-align:center}.xt.hr>b{text-align:right}
.xt.w>b{white-space:pre-wrap;word-break:break-all}
.xt.dist>b{text-align:justify;text-align-last:justify}
.xt.vt{writing-mode:vertical-rl;justify-content:center}
.xt.vt>b{flex:0 0 auto;text-align:center}
.xs{position:absolute;display:block}
.xb{position:absolute;display:flex;flex-direction:column;box-sizing:border-box;overflow:hidden;line-height:1.15;font-family:'ＭＳ Ｐゴシック','MS PGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans CJK JP',sans-serif}
@media print{.xp{margin:0!important;box-shadow:none!important}}
.xt.clip{overflow:hidden}

</style>

    let sh = null;
    if(e && sheetFor[e.sheet] && sheetFor[e.sheet].code === l.site) sh = sheetFor[e.sheet];
    if(!sh) sh = sheetOfCode(l.site);
    if(!sh.siteName && D.sites[l.site]) sh.siteName = D.sites[l.site].name;
    const mode = S.opt.carry || 'simple';
    if(e && e.edited && mode !== 'none' && (mode === 'all' || simpleEdit(e))){
      /* 前月の手直しを今月にも（何行かに分けていたら、そのまま分ける）。金額は今月の日数で計算し直す */
      applyVers(l, e, sh).forEach(n => S.lines.push(n));
    }else{
      l.sheet = sh.id; S.lines.push(l);
      /* 分けた・別の品にした手直しは「候補」にして、確かめてから使う */
      if(e && e.edited && mode !== 'none'){
        const tmp = applyVers(Object.assign({}, l, { sys: l.sys }), e, sh);
        l.sugg = { n: e.vers.length, names: e.vers.map(v => v.name), amt: tmp.reduce((a, x) => a + lineAmt(x), 0) };
      }
    }
  });
  /* 前月の手入力の行（システムにない行）は、候補として各シートに覚えておく */
  if(P) S.sheets.forEach(sh => { if(sh.prev) sh.prevManual = (sh.prev.lines || []).filter(L => !L.key && (L.la + L.sa + L.ba) !== 0); });
  /* 今月の行がない前月の現場シートは、鑑から外して後ろへ */
  S.sheets.forEach(sh => { if(!S.lines.some(l => l.sheet === sh.id)){ sh.inKagami = false; sh.emptyNow = true; } });
  S.sheets.sort((a, b) => (a.emptyNow ? 1 : 0) - (b.emptyNow ? 1 : 0));
  S.cur = S.sheets[0] ? S.sheets[0].id : null;
  save();
}

/* ====================== チェック ====================== */
function checks(){
  const out = [], P = S.prev;
  const T = totals();
  if(T.diff) out.push({ lv:'warn', t:'鑑の税抜が、システムと ' + (T.diff > 0 ? '+' : '') + yen(T.diff) + ' 違う', s:'手直し・調整の合計です。意図どおりか確かめて（外した現場があればそのぶんも）' });
  S.lines.forEach(l => {
    const sh = sheetById(l.sheet);
    if(l.kb === '日極' && num(l.days) > 20 && num(l.lu) >= 300 && !/保証/.test(l.name)) out.push({ lv:'info', t:'日極で ' + l.days + ' 日：' + l.name, s: sh.name + '　月極のほうが安くなるかも（月極の単価を確かめて）', id: l.id, sh: sh.id });
    if(l.kb === '月極' && num(l.days) > 0 && num(l.days) <= 7 && l.retd) out.push({ lv:'info', t:'月極で ' + l.days + ' 日で返却：' + l.name, s: sh.name + '　日極のほうが合うかも', id: l.id, sh: sh.id });
    if(lineAmt(l) < 0 && !l.manual) out.push({ lv:'warn', t:'マイナスの行：' + l.name + ' ' + yen(lineAmt(l)), s: sh.name, id: l.id, sh: sh.id });
    if(!lineAmt(l) && num(l.qty) && !['訂正'].includes(l.kb)) out.push({ lv:'info', t:'0円の行：' + l.name, s: sh.name + '（' + l.kb + '）', id: l.id, sh: sh.id });
    if(!l.name || !String(l.name).trim()) out.push({ lv:'warn', t:'品名が空の行', s: sh.name, id: l.id, sh: sh.id });
  });
  if(P){
    const now = new Set(S.lines.map(l => l.key).filter(Boolean));
    const nowLoose = new Set(S.lines.map(l => l.key && keyLoose(l.key)).filter(Boolean));
    const gone = Array.from(P.continuing || []).filter(k => !now.has(k) && !nowLoose.has(keyLoose(k)));
    gone.slice(0, 40).forEach(k => { const v = P.byKey[k].vers[0]; out.push({ lv:'info', t:'前月「継続」だったのに今月のCSVにない：' + v.name, s:'前月 ' + P.byKey[k].sheet + '　返却済みなら問題なし' }); });
    S.lines.forEach(l => {
      if(!l.key || l.carried) return; const e = P.byKey[l.key]; if(!e) return; const v = e.vers[0];
      if(v.lu && l.lu && v.lu !== l.lu) out.push({ lv:'info', t:'単価が前月と違う：' + l.name, s:'前月 ' + yen(v.lu) + ' → 今月 ' + yen(l.lu) + '　' + sheetById(l.sheet).name, id: l.id, sh: l.sheet });
    });
    S.sheets.forEach(sh => { if(sh.prev && sh.prev.total){ const r = sheetNet(sh) / sh.prev.total; if(r > 1.5 || r < 0.5) out.push({ lv:'info', t:sh.name + '：前月から大きく変わった', s:'前月 ' + yen(sh.prev.total) + ' → 今月 ' + yen(sheetNet(sh)), sh: sh.id }); } });
  }
  S.lines.filter(l => l.sugg).forEach(l => out.push({ lv:'info', t:'前月の書きかえ候補：' + l.name, s: sheetById(l.sheet).name + '　前月は「' + l.sugg.names.slice(0, 3).join('・') + '」で請求。今月も同じにするか確かめて', id: l.id, sh: l.sheet }));
  S.sheets.forEach(sh => { if(!linesOf(sh).length && !sh.emptyNow) out.push({ lv:'warn', t:sh.name + '：行がない', s:'鑑に0円で出ます。いらなければ「鑑に出す」を外して', sh: sh.id }); if(S.meta.custCode === '3057' && sh.inKagami && !sh.kouji) out.push({ lv:'warn', t:sh.name + '：工事番号が空', s:'三貴の請求書に入ります', sh: sh.id }); });
  return out;
}

const todayIso = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
function headVals(m, siteName, siteCode){
  const v = { F7: m.zip, E8: m.addr, E10: m.custName, E12: siteName || '', AA12: m.seikyuDate, AA15: m.payDate, I16: m.custCode, K16: m.custBr || '0', I18: siteCode || '' };
  return v;
}
function sumVals(v, net, tx, m, zan){
  v.X22 = net; v.AB22 = tx; v.AF22 = net + tx; v.AI22 = net + tx;
  if(zan){ v.C22 = m.prevBill; v.G22 = m.nyukin; v.N22 = m.nebiki; v.Q22 = m.kurikoshi; v.AI22 = num(m.kurikoshi) + net + tx; }
  return v;
}
function chunk(arr, first, rest){
  const out = [arr.slice(0, first)];
  for(let i = first; i < arr.length; i += rest) out.push(arr.slice(i, i + rest));
  return out;
}
function paperKagami(){
  const m = S.meta, ks = S.sheets.filter(s => s.inKagami), T = totals();
  const pages = chunk(ks, 15, 22);
  return pages.map((pg, pi) => {
    let v, r0;
    if(pi === 0){ v = sumVals(headVals(m, '', ''), T.net, T.tax, m, S.opt.zan); r0 = 26; }
    else { v = { C60: m.custName, O60: m.custCode, T60: '', AG60: '' }; r0 = 65; }
    pg.forEach((sh, i) => { const r = r0 + i * 2, n = sheetNet(sh), x = tax(n); v['C' + r] = sh.siteName || sh.name; v['O' + r] = sh.code; v['AJ' + (r + 1)] = n; v['AL' + (r + 1)] = x; v['AM' + (r + 1)] = n + x; });
    return XR.page(pi === 0 ? XT.kagami1 : XT.kagami2, v, { id: '鑑', pn: (pi + 1) + '/' + pages.length });
  }).join('');
}
function lineVals(v, l, r){
  /* Excelの現場シートの式と同じ取り方（コピペ!A〜I 列） */
  const ret = num(l.ret0) >= 1 ? l.ret0 : l.den;                     /* 返却伝票があればそちら */
  const kan = l.kanri && l.kanri !== 'W' ? l.kanri : (l.shohin || ''); /* 管理番号が空か W なら商品番号 */
  const dd = (a, b) => { if(!a || !b) return ''; return Math.round((Date.parse(b) - Date.parse(a)) / 864e5) + 1; };
  v['C' + r] = l.name; v['O' + r] = ret; v['O' + (r + 1)] = kan;
  v['S' + r] = l.kashi || ''; v['U' + r] = l.start || ''; v['W' + r] = l.end || ''; v['Y' + r] = l.cont || l.retd || '';
  v['Z' + r] = num(l.qty); v['AC' + r] = l.unit || ''; v['AD' + r] = dd(l.start, l.end); v['AE' + r] = num(l.kyu);
  const same = !l.sys || (l.sys.start === l.start && (l.sys.end === undefined || l.sys.end === l.end));
  v['AG' + r] = same ? num(l.days) : dd(l.start, l.end); v['AG' + (r + 1)] = num(l.sdays); v['AI' + r] = l.kb || '';
  v['AJ' + r] = num(l.lu); v['AL' + r] = num(l.la); v['AJ' + (r + 1)] = num(l.su); v['AL' + (r + 1)] = num(l.sa);
  v['AM' + r] = num(l.bu); v['AP' + r] = num(l.ba);
}
function paperSheet(sh){
  const m = S.meta, ls = linesOf(sh), n = sheetNet(sh), nm = sh.siteName || sh.name;
  const pages = chunk(ls, 15, 22);
  return pages.map((pg, pi) => {
    let v, r0;
    if(pi === 0){ v = sumVals(headVals(m, nm, sh.code), n, tax(n), m, false); r0 = 26; }
    else { v = { C59: m.custName, O59: m.custCode, T59: nm, AG59: sh.code }; r0 = 64; }
    pg.forEach((l, i) => lineVals(v, l, r0 + i * 2));
    return XR.page(pi === 0 ? XT.site1 : XT.site2, v, { id: sh.name, pn: (pi + 1) + '/' + pages.length });
  }).join('');
}
/* 三貴の指定用紙 */
function meVals(m){ return { zip: m.brZip || '340-0811', addr: m.brAddr || '埼玉県八潮市大字二丁目1048-1', co: m.company || '株式会社ワークス', tel: m.brTel || '048-994-2721', fax: m.brFax || '048-994-2722', inv: S.opt.inv || 'T6030001067872', kyo: S.opt.kyo || '10273' }; }
function paperSkCover(){
  const ks = S.sheets.filter(s => s.inKagami), m = S.meta, me = meVals(m);
  const pages = chunk(ks, 30, 30);
  let tn = 0, tt = 0;
  return pages.map((pg, pi) => {
    const v = { U2: todayIso(), H12: m.seikyuDate, O3: me.zip, N4: me.addr, N7: me.co, P9: me.inv, U9: me.kyo, O10: me.tel, T10: me.fax };
    let pn = 0, px = 0;
    for(let i = 0; i < 30; i++){
      const r = 14 + i, sh = pg[i];
      v['E' + r] = pi * 30 + i + 1;
      if(!sh) continue;
      const n = sheetNet(sh), x = tax(n); pn += n; px += x;
      v['F' + r] = sh.kouji || ''; v['G' + r] = sh.siteName || sh.name; v['H' + r] = n; v['I' + r] = x; v['J' + r] = n + x;
    }
    tn += pn; tt += px;
    v.H44 = pn; v.I44 = px; v.J44 = pn + px;
    return XR.page(XT.cover, v, { id: '請求書表紙', bw: true });
  }).join('');
}
function paperSkSheet(sh){
  const n = sheetNet(sh), x = tax(n), m = S.meta, me = meVals(m);
  const v = { AV3: me.zip, AU4: me.addr, AU5: '', Z6: m.seikyuDate, AU7: me.co, AW9: me.inv, BB9: me.kyo, AV10: me.tel, BA10: me.fax,
    AJ16: n, AO16: n, F21: sh.siteName || sh.name, F23: sh.kouji || '', AO21: n, AO22: x, AO23: n + x, I24: n, X24: x };
  return XR.page(XT.sk, v, { id: 's' + sh.name });
}
function drawPaper(){
  const o = S.opt, sk = S.meta.custCode === '3057';
  $('#pvOpts').innerHTML = '<label><input type="checkbox" data-o="kagami"' + (o.kagami ? ' checked' : '') + '>鑑（現場合計表）</label><label><input type="checkbox" data-o="sheets"' + (o.sheets ? ' checked' : '') + '>現場ごとの御請求書（明細）</label>' +
    (sk ? '<label><input type="checkbox" data-o="skCover"' + (o.skCover ? ' checked' : '') + '>三貴：請求書表紙</label><label><input type="checkbox" data-o="sk"' + (o.sk ? ' checked' : '') + '>三貴：請求書（指定用紙）</label>' : '') +
    '<label><input type="checkbox" data-o="zan"' + (o.zan ? ' checked' : '') + '>鑑に前回・入金・繰越を出す</label>';
  const pv = $('#pv');
  pv.innerHTML = paperHtml();
  fitPv(); XR.fitShrink(pv);
}
function fitPv(){
  const pv = $('#pv'); if(!pv) return;
  const w = pv.clientWidth - 4; if(w <= 0) return;
  $$('.xp', pv).forEach(p => { const pw = p.classList.contains('port') ? 794 : 1123; p.style.zoom = Math.min(1, w / pw).toFixed(4); });
}
window.addEventListener('resize', () => { if(S.tab === 'paper') fitPv(); });
function paperHtml(){
  const o = S.opt, sk = S.meta.custCode === '3057', ks = S.sheets.filter(s => s.inKagami);
  let h = '';
  if(sk && o.skCover) h += paperSkCover();
  if(o.kagami) h += paperKagami();
  ks.forEach(sh => { if(sk && o.sk) h += paperSkSheet(sh); if(o.sheets) h += paperSheet(sh); });
  return h;
}
function doPrint(){
  $('#print').innerHTML = paperHtml(); $('#print').style.display = 'block'; XR.fitShrink($('#print')); $('#print').style.display = '';
  const t = document.title; document.title = (S.meta.seikyuDate || '').replace(/-/g, '').slice(2) + '_御請求書_' + S.meta.custName.replace(/\s/g, '') + '御中';
  setTimeout(() => { window.print(); setTimeout(() => { document.title = t; }, 500); }, 100);
}

/* ====================== 読み込みの操作 ====================== */
function readFileText(f){ return f.arrayBuffer().then(b => { let t; try{ t = new TextDecoder('utf-8', { fatal:true }).decode(b); }catch(e){ t = new TextDecoder('shift_jis').decode(b); } return t.replace(/^﻿/, ''); }); }
async function takeCsv(f){
  try{ const t = await readFileText(f); const D = readCsv(t); csvText = t; csvName = f.name;
    $('#stCsv').textContent = '✓ ' + D.meta.custName + '　' + jdate(D.meta.seikyuDate) + '締め　' + D.lines.length + '行・' + Object.keys(D.sites).length + '現場　税抜 ' + yen(D.meta.sysNet);
    $('#btnBuild').disabled = false; $('#buildMsg').textContent = '準備OK。押すと現場ごとに分けます。';
  }catch(e){ $('#stCsv').textContent = ''; toast(e.message || 'CSVを読めませんでした', 5000); }
}
async function takePrev(f){
  try{
    if(/\.json$/i.test(f.name)){ prevData = readCarry(JSON.parse(await f.text())); }
    else prevData = readPrevBook(await f.arrayBuffer());
    prevName = f.name;
    const ed = Object.values(prevData.byKey).filter(e => e.edited).length;
    $('#stPrev').textContent = '✓ ' + (prevData.label ? jdate(prevData.label) + '締め　' : '') + prevData.sheets.length + '現場・手直し ' + ed + '品';
  }catch(e){ console.error(e); prevData = null; $('#stPrev').textContent = ''; toast('前月のファイルを読めませんでした：' + (e.message || e), 6000); }
}
function bindDrop(el, input, fn){
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('on'); });
  el.addEventListener('dragleave', () => el.classList.remove('on'));
  el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('on'); const f = e.dataTransfer.files[0]; if(f) fn(f); });
  input.addEventListener('change', () => { const f = input.files[0]; if(f) fn(f); input.value = ''; });
}

/* ====================== はじめ ====================== */
bindDrop($('#dropCsv'), $('#fCsv'), takeCsv);
bindDrop($('#dropPrev'), $('#fPrev'), takePrev);
$('#btnBuild').addEventListener('click', () => {
  if(S.built && !confirm('いまの作業を、CSVから作り直します（直したところは消えます）。よいですか？')) return;
  const cr = document.querySelector('input[name="carry"]:checked'); S.opt.carry = cr ? cr.value : 'simple';
  try{ build(); toast('現場ごとに分けた' + (S.prev ? '（前月の手直しを引き継ぎ）' : '')); setTab('sites'); }catch(e){ console.error(e); toast('作れませんでした：' + (e.message || e), 6000); }
});
$$('.tabs button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
$('#siteList').addEventListener('click', onSiteClick);
$('#siteBody').addEventListener('click', ev => { if(ev.target.id === 'addLine') return addManual(false); if(ev.target.id === 'addAdj') return addManual(true); onSiteClick(ev); });
$('#siteBody').addEventListener('change', onSiteChange);
$('#siteBody').addEventListener('keydown', ev => { if(ev.key === 'Enter' && ev.target.matches('input')){ ev.preventDefault(); ev.target.blur(); } });
$('#pvOpts').addEventListener('change', ev => { const k = ev.target.dataset.o; if(k){ S.opt[k] = ev.target.checked; save(); drawPaper(); } });
$('#btnPrint').addEventListener('click', doPrint);
$('#btnExport').addEventListener('click', exportCarry);
document.addEventListener('keydown', ev => {
  if(ev.target.matches('input,select,textarea') || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const map = { '1':'load', '2':'sites', '3':'check', '4':'paper' };
  if(map[ev.key]){ setTab(map[ev.key]); ev.preventDefault(); return; }
  if(ev.key === 'Enter' && S.tab === 'load' && !$('#btnBuild').disabled){ $('#btnBuild').click(); ev.preventDefault(); return; }
  if((ev.key === 'p' || ev.key === 'P') && S.tab === 'paper'){ doPrint(); ev.preventDefault(); return; }
  if(S.tab === 'sites' && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp')){
    const i = S.sheets.findIndex(s => s.id === S.cur); const j = Math.max(0, Math.min(S.sheets.length - 1, i + (ev.key === 'ArrowDown' ? 1 : -1)));
    if(j !== i){ S.cur = S.sheets[j].id; save(); drawSites(); } ev.preventDefault();
  }
});
(function(){
  const sv = loadSaved();
  if(sv && sv.meta){
    $('#resumeCard').hidden = false;
    $('#resumeTxt').textContent = sv.meta.custName + '　' + jdate(sv.meta.seikyuDate) + '締め（' + new Date(sv.t).toLocaleString('ja-JP') + ' まで作業）';
    $('#btnResume').onclick = () => { S.meta = sv.meta; S.sheets = sv.sheets; S.lines = sv.lines; S.seq = sv.seq || 1000; S.opt = Object.assign(S.opt, sv.opt || {}); S.cur = sv.cur || (S.sheets[0] && S.sheets[0].id); S.prev = sv.prevLabel ? { label: sv.prevLabel, byKey:{}, continuing:new Set() } : null; S.built = true; setTab('sites'); };
    $('#btnDrop').onclick = () => { try{ localStorage.removeItem(LSK); }catch(e){} $('#resumeCard').hidden = true; };
  }
})();

/* ====================== 版：ページの版を見て、新しい版があれば帯で知らせる ====================== */
const APP_VER = '10/23 13:58';
let verChecked = 0;
function checkVer(){
  if(location.protocol === 'file:' || Date.now() - verChecked < 60000) return;
  verChecked = Date.now();
  fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.text() : '').then(t => {
    const m = /const APP_VER = '([^']+)'/.exec(t || '');
    if(!m || m[1] === APP_VER || document.getElementById('verBar')) return;
    const b = document.createElement('div'); b.id = 'verBar';
    b.style.cssText = 'position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:99;background:#0F4C55;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer';
    b.textContent = '新しい版（' + m[1] + '）があります。押すと読み直します';
    b.onclick = () => { save(); location.reload(); };
    document.body.appendChild(b);
  }).catch(() => {});
}
document.addEventListener('visibilitychange', () => { if(!document.hidden) checkVer(); });
setTimeout(checkVer, 3000);
</script>
